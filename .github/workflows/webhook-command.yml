name: Webhook Trigger
run-name: webhook-trigger ${{ inputs.request_id }}

permissions:
  contents: read
  actions: write

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique request identifier for tracking
        required: true
        type: string
      source_repo:
        description: Source repository (owner/name) — used for concurrency grouping
        required: true
        type: string
      payload:
        description: Full JSON webhook payload distilled by the Cloudflare worker
        required: true
        type: string

concurrency:
  group: webhook-command-${{ inputs.source_repo }}
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          path: .bot
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6

      - name: Resolve request
        id: request
        shell: bash
        env:
          INPUT_PAYLOAD: ${{ inputs.payload }}
          INPUT_SOURCE_REPO: ${{ inputs.source_repo }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import sys

          payload = json.loads(os.environ["INPUT_PAYLOAD"])
          source_repo = payload["source_repo"]

          if source_repo != os.environ["INPUT_SOURCE_REPO"]:
              print("::error::payload source_repo does not match workflow input", file=sys.stderr)
              sys.exit(1)

          source_owner, source_name = source_repo.split("/", 1)

          outputs = {
              "request_id": payload["request_id"],
              "source_repo": source_repo,
              "source_owner": source_owner,
              "source_name": source_name,
              "event_name": payload["event_name"],
              "event_action": payload["event_action"],
              "trigger_kind": payload["trigger_kind"],
              "subject_kind": payload["subject_kind"],
              "requested_by": payload["requested_by"],
              "requested_by_association": payload["requested_by_association"],
              "issue_number": str(payload["issue_number"]),
              "delivery_id": payload.get("delivery_id", ""),
              "request_url": payload.get("request_url", ""),
          }
          for key, value in outputs.items():
              safe = str(value).replace("\n", "").replace("\r", "")
              print(f"{key}={safe}")
          PY

      - name: Validate source repo
        env:
          SOURCE_REPO: ${{ steps.request.outputs.source_repo }}
          SOURCE_OWNER: ${{ steps.request.outputs.source_owner }}
        run: |
          uv run --project .bot python -m bot.allowlist check-repo "$SOURCE_REPO"

          if [ "$SOURCE_OWNER" != "6" ]; then
            echo "::error::6/bot only accepts webhook commands for repositories owned by 6"
            exit 1
          fi

      - name: Persist webhook payload
        env:
          INPUT_PAYLOAD: ${{ inputs.payload }}
        run: |
          mkdir -p "$RUNNER_TEMP/webhook-trigger"
          printf '%s' "$INPUT_PAYLOAD" > "$RUNNER_TEMP/webhook-trigger/request.json"

      - name: Summarize webhook request
        env:
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          SOURCE_REPO: ${{ steps.request.outputs.source_repo }}
          EVENT_NAME: ${{ steps.request.outputs.event_name }}
          EVENT_ACTION: ${{ steps.request.outputs.event_action }}
          TRIGGER_KIND: ${{ steps.request.outputs.trigger_kind }}
          SUBJECT_KIND: ${{ steps.request.outputs.subject_kind }}
          REQUESTED_BY: ${{ steps.request.outputs.requested_by }}
          REQUESTED_BY_ASSOCIATION: ${{ steps.request.outputs.requested_by_association }}
          ISSUE_NUMBER: ${{ steps.request.outputs.issue_number }}
          DELIVERY_ID: ${{ steps.request.outputs.delivery_id }}
          REQUEST_URL: ${{ steps.request.outputs.request_url }}
        run: |
          {
            echo "## Webhook trigger"
            echo
            echo "- Request ID: $REQUEST_ID"
            echo "- Source repo: $SOURCE_REPO"
            echo "- Event: $EVENT_NAME / $EVENT_ACTION"
            echo "- Trigger: $TRIGGER_KIND on $SUBJECT_KIND"
            if [ -n "$REQUESTED_BY_ASSOCIATION" ]; then
              echo "- Requested by: $REQUESTED_BY ($REQUESTED_BY_ASSOCIATION)"
            else
              echo "- Requested by: $REQUESTED_BY"
            fi
            echo "- Issue or PR number: $ISSUE_NUMBER"
            if [ -n "$DELIVERY_ID" ]; then
              echo "- Delivery ID: $DELIVERY_ID"
            fi
            if [ -n "$REQUEST_URL" ]; then
              echo "- Request URL: $REQUEST_URL"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch repo task internally
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PAYLOAD: ${{ inputs.payload }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          SOURCE_REPO: ${{ steps.request.outputs.source_repo }}
        run: |
          PAYLOAD_FILE="$RUNNER_TEMP/internal-repo-task-dispatch.json"
          python3 - <<'PY' > "$PAYLOAD_FILE"
          import json
          import os

          payload = {
              "ref": "main",
              "inputs": {
                  "request_id": os.environ["REQUEST_ID"],
                  "source_repo": os.environ["SOURCE_REPO"],
                  "payload": os.environ["INPUT_PAYLOAD"],
              },
          }
          print(json.dumps(payload))
          PY
          gh api "repos/${{ github.repository }}/actions/workflows/repo-task.yml/dispatches" \
            --method POST \
            --input "$PAYLOAD_FILE"

      - name: Upload webhook payload
        uses: actions/upload-artifact@v6
        with:
          name: webhook-trigger-${{ steps.request.outputs.request_id }}
          path: $RUNNER_TEMP/webhook-trigger/request.json
          retention-days: 7
