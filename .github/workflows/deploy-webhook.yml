name: Deploy Webhook

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-webhook.yml
      - config/allowlist.toml
      - src/bot/allowlist.py
      - workers/github-webhook/**
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_WORKER_NAME: ${{ secrets.CLOUDFLARE_WORKER_NAME }}
      GH_APP_ID: ${{ vars.GH_APP_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6

      - name: Validate deploy env
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_WORKER_NAME"
          test -n "$GH_APP_ID"

      - name: Mask worker identifiers
        shell: bash
        env:
          CLOUDFLARE_WORKER_NAME: ${{ secrets.CLOUDFLARE_WORKER_NAME }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ secrets.CLOUDFLARE_WORKERS_SUBDOMAIN }}
        run: |
          echo "::add-mask::$CLOUDFLARE_WORKER_NAME"
          if [ -n "$CLOUDFLARE_WORKERS_SUBDOMAIN" ]; then
            echo "::add-mask::${CLOUDFLARE_WORKER_NAME}.${CLOUDFLARE_WORKERS_SUBDOMAIN}.workers.dev"
          fi

      - name: Resolve allowlist
        run: |
          echo "ALLOWLIST_CSV=$(uv run python -m bot.allowlist print-csv)" >> "$GITHUB_ENV"

      - name: Sync worker dependencies
        working-directory: workers/github-webhook
        run: uv sync --frozen --group dev

      - name: Deploy webhook worker
        working-directory: workers/github-webhook
        run: |
          uv run pywrangler deploy \
            --name "$CLOUDFLARE_WORKER_NAME" \
            --var "GH_APP_ID:$GH_APP_ID" \
            --var "ALLOWED_REPOSITORIES:$ALLOWLIST_CSV"
