[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "6bot"
version = "0.1.0"
description = "Shared privileged runner helpers for the 6/bot control plane"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.4.2",
  "ruff>=0.12.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
