[tools]
node = "22"
python = "3.13"
uv = "latest"

[tasks.worker-webhook-sync]
dir = "workers/github-webhook"
run = "uv sync --group dev"

[tasks.worker-webhook-check]
dir = "workers/github-webhook"
run = "uv run ruff check src tests && uv run pytest -q"

[tasks.worker-webhook-dev]
dir = "workers/github-webhook"
run = "uv run pywrangler dev"

[tasks.worker-webhook-deploy]
dir = "workers/github-webhook"
run = "test -n \"$CLOUDFLARE_WORKER_NAME\" && test -n \"$GH_APP_ID\" && ALLOWLIST_CSV=$(uv run --project ../.. python -m bot.allowlist print-csv) && uv run pywrangler deploy --name \"$CLOUDFLARE_WORKER_NAME\" --var \"GH_APP_ID:$GH_APP_ID\" --var \"ALLOWED_REPOSITORIES:$ALLOWLIST_CSV\""
