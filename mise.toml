[tools]
node = "22"
python = "3.13"
uv = "latest"

[tasks.worker-webhook-sync]
dir = "worker/github-webhook"
run = "uv sync --group dev"

[tasks.worker-webhook-check]
dir = "worker/github-webhook"
run = "uv run ruff check src tests && uv run pytest -q"

[tasks.worker-webhook-dev]
dir = "worker/github-webhook"
run = "uv run pywrangler dev"

[tasks.worker-webhook-deploy]
dir = "worker/github-webhook"
run = "uv run pywrangler deploy"
